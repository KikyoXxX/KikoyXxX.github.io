<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キャラクター-桔梗HP</title>
    <style>
        /* ---- 全体 ---- */
body {
    margin: 0;
    font-family: "Noto Sans JP", sans-serif;
    background: #0d0b12;
    color: #e8d6ff;
}

/* ---- ヒーローセクション ---- */
.hero {
    text-align: center;
    padding: 80px 20px;
    background: linear-gradient(180deg, #1a1523, #0d0b12);
    border-bottom: 1px solid #3a2d4a;
}

.hero h1 {
    font-family: "Cinzel", serif;
    font-size: 3rem;
    margin: 0;
    letter-spacing: 2px;
}

.hero p {
    margin-top: 10px;
    font-size: 1.1rem;
    opacity: 0.8;
}

/* ---- キャラ一覧 ---- */
.character-list {
    position: relative;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 190px));
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 1.5vw, 22px);
    min-height: 540px;
    padding: 50px 20px 80px;
    isolation: isolate;
}

.character-list::before {
    content: "✦  ✧  ✦  ✧  ✦";
    position: absolute;
    top: 18px;
    left: 50%;
    color: rgba(232, 214, 255, 0.42);
    font-family: Georgia, serif;
    font-size: 0.85rem;
    letter-spacing: 1.1em;
    transform: translateX(-50%);
    white-space: nowrap;
}

.tarot-back {
    position: relative;
    display: block;
    aspect-ratio: 0.64;
    box-sizing: border-box;
    padding: 12px;
    border: 1px solid rgba(232, 214, 255, 0.3);
    border-radius: 4px;
    background:
        repeating-linear-gradient(45deg, transparent 0 8px, rgba(232, 214, 255, 0.05) 8px 9px),
        linear-gradient(145deg, #5b13c6, #0e121d);
    box-shadow: 0 15px 28px rgba(0, 0, 0, 0.28), inset 0 0 0 5px rgba(10, 12, 20, 0.75);
    transform: rotate(var(--tilt));
    z-index: 0;
}

.tarot-back::before {
    content: "✧";
    position: absolute;
    inset: 12px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(232, 214, 255, 0.24);
    color: rgba(232, 214, 255, 0.5);
    font-family: Georgia, serif;
    font-size: 4rem;
}

.char-card {
    position: relative;
    display: block;
    text-decoration: none;
    background:
        linear-gradient(135deg, rgba(255,255,255,0.09), transparent 28%),
        linear-gradient(160deg, #4c0966, #120e19 72%);
  
   
    box-shadow: 0 18px 34px rgba(0, 0, 0, 0.38), inset 0 0 0 5px rgba(20, 12, 28, 0.8);
    transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
}

.char-card::before,
.char-card::after {
    position: absolute;
    z-index: 2;
    color: rgba(232, 214, 255, 0.72);
    font-family: Georgia, serif;
    font-size: 1rem;
    line-height: 1;
    pointer-events: none;
}


.char-card:hover,
.char-card:focus-visible {
    transform: translateY(-16px) rotate(0deg) scale(1.035);
    border-color: #f6eaff;
    box-shadow: 0 24px 44px rgba(0, 0, 0, 0.5), 0 0 28px rgba(232, 214, 255, 0.2), inset 0 0 0 5px rgba(20, 12, 28, 0.8);
    outline: none;
}

.char-card.card-left {
    transform: rotate(-6deg) translateY(18px);
    z-index: 1;
}

.char-card.card-center {
    transform: translateY(-16px) scale(1.0);
    z-index: 3;
}

.char-card.card-right {
    transform: rotate(6deg) translateY(18px);
    z-index: 1;
}

.char-card.card-left.card-inverted {
    transform: rotate(174deg) translateY(18px);
}

.char-card.card-center.card-inverted {
    transform: rotate(180deg) translateY(-16px) scale(1.0);
}

.char-card.card-right.card-inverted {
    transform: rotate(186deg) translateY(18px);
}

.char-card.card-left:hover,
.char-card.card-left:focus-visible,
.char-card.card-right:hover,
.char-card.card-right:focus-visible {
    transform: translateY(2px) rotate(0deg) scale(1.035);
}

.char-card.card-inverted:hover,
.char-card.card-inverted:focus-visible {
    transform: translateY(2px) rotate(180deg) scale(1.035);
}

.char-card.card-center:hover,
.char-card.card-center:focus-visible {
    transform: translateY(-28px) scale(1.1);
}

.char-card.card-center.card-inverted:hover,
.char-card.card-center.card-inverted:focus-visible {
    transform: rotate(180deg) translateY(-28px) scale(1.1);
}

.character-list.is-selecting .char-card:not(.is-selected) {
    opacity: 0.28;
    filter: saturate(0.35) brightness(0.65);
    transition: opacity 0.45s ease, filter 0.45s ease;
}

.char-card.is-selected {
    z-index: 5;
    animation: chosen-card 1.8s ease both;
}

@keyframes chosen-card {
    0% {
        filter: brightness(1);
    }
    18% {
        filter: brightness(1.45) drop-shadow(0 0 5px rgba(246, 234, 255, 0.9));
    }
    42% {
        filter: brightness(1.12) drop-shadow(0 0 22px rgba(232, 214, 255, 0.85));
    }
    72% {
        filter: brightness(1.28) drop-shadow(0 0 12px rgba(232, 214, 255, 0.65));
    }
    100% {
        filter: brightness(1) drop-shadow(0 0 0 rgba(232, 214, 255, 0));
    }
}

@media (prefers-reduced-motion: reduce) {
    .char-card.is-selected {
        animation: none;
    }
}

.char-card img {
    width: 100%;
    height: auto;
    object-fit: contain;
    display: block;
    border: 1px solid rgba(232, 214, 255, 0.28);
    margin-bottom: 12px;
    filter: saturate(0.9) contrast(1.04);
}

.char-card h2 {
    font-family: "Cinzel", serif;
    font-size: 1.55rem;
    margin: 8px 0 3px;
    letter-spacing: 0.08em;
}

.subtitle {
    font-size: 0.9rem;
    opacity: 0.7;
    letter-spacing: 0.2em;
}



@media (max-width: 760px) {
    .character-list {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        min-height: 390px;
        padding: 42px 12px 55px;
    }

    .tarot-back {
        display: none;
    }

    .char-card {
        padding: 8px;
    }

    .char-card::before,
    .char-card::after {
        font-size: 0.7rem;
    }

    .char-card::before {
        top: 14px;
        left: 13px;
    }

    .char-card::after {
        right: 13px;
        bottom: 14px;
    }

    .char-card.card-left,
    .char-card.card-center,
    .char-card.card-right {
        transform: none;
    }

    .char-card.card-center {
        transform: scale(1.04);
    }

    .char-card.card-left.card-inverted,
    .char-card.card-center.card-inverted,
    .char-card.card-right.card-inverted {
        transform: rotate(180deg);
    }

    .char-card.card-left:hover,
    .char-card.card-left:focus-visible,
    .char-card.card-right:hover,
    .char-card.card-right:focus-visible {
        transform: translateY(-10px) rotate(-1deg) scale(1.035);
    }

    .char-card.card-inverted:hover,
    .char-card.card-inverted:focus-visible {
        transform: translateY(-10px) rotate(180deg) scale(1.035);
    }

    .char-card.card-center:hover,
    .char-card.card-center:focus-visible {
        transform: translateY(-12px) scale(1.08);
    }

    .char-card.card-center.card-inverted:hover,
    .char-card.card-center.card-inverted:focus-visible {
        transform: rotate(180deg) translateY(-12px) scale(1.08);
    }

    .char-card h2 {
        font-size: clamp(0.85rem, 4vw, 1.25rem);
        letter-spacing: 0.02em;
    }

    .subtitle {
        font-size: 0.65rem;
        letter-spacing: 0.08em;
    }

    .card-mark {
        font-size: 0.55rem;
        letter-spacing: 0.12em;
    }
}

/* ---- フッター ---- */
footer {
    position: relative;
    z-index: 1;
    padding: 46px 24px 34px;
    border-top: 1px solid rgba(184, 164, 119, 0.28);
    background: rgba(6, 9, 20, 0.72);
    text-align: center;
}

.site-map-title {
    margin: 0 0 18px;
    color: #b8a477;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 0.72rem;
    font-weight: 400;
    letter-spacing: 0.32em;
}

.site-map {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 24px;
    max-width: 760px;
    margin: 0 auto 28px;
    padding: 0;
    list-style: none;
}

.site-map a {
    display: inline-block;
    padding: 5px 0;
    color: rgba(241, 236, 223, 0.78);
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-decoration: none;
    transition: color 180ms ease, transform 180ms ease;
}

.site-map a:hover,
.site-map a:focus-visible {
    color: #f1ecdf;
    transform: translateY(-2px);
}

.site-map a:focus-visible {
    outline: 1px solid #b8a477;
    outline-offset: 4px;
}

.footer-signature {
    margin: 0;
    color: rgba(213, 220, 244, 0.52);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 0.75rem;
    letter-spacing: 0.18em;
}


 .brandLogo { width: min(210px, 70vw); }

  
      .brand {
        position: absolute;
        top: -10px;
        left: 15px;
        pointer-events: auto;
        display: flex;
        align-items: center;
      }

      .brandLogo {
  width: min(270px, 48vw);
        height: auto;
        display: block;
        opacity: 0.96;
        image-rendering: -webkit-optimize-contrast;
        filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.42));
        user-select: none;
        -webkit-user-drag: none;
      }

            body {
                position: relative;
                isolation: isolate;
            }

            body::before {
                content: "";
                position: fixed;
                inset: 0;
                z-index: 0;
                pointer-events: none;
                opacity: 0.18;
                background:
                    radial-gradient(circle at 18% 22%, rgba(126, 102, 186, 0.16), transparent 26%),
                    radial-gradient(circle at 82% 68%, rgba(76, 129, 190, 0.12), transparent 28%);
            }

            .hero,
            .character-list,
            footer {
                position: relative;
                z-index: 1;
            }

            .hero {
                overflow: hidden;
            }

            .hero::after {
                content: "";
                position: absolute;
                left: 50%;
                bottom: -1px;
                width: min(300px, 62vw);
                height: 1px;
                background: linear-gradient(90deg, transparent, rgba(232, 214, 255, 0.85), transparent);
                transform: translateX(-50%) scaleX(0.5);
                animation: list-line-breathe 9s ease-in-out infinite;
            }

            .character-list::before {
                color: rgba(232, 214, 255, 0.32);
                animation: constellation-pulse 12s ease-in-out infinite;
            }

            .tarot-back::before {
                animation: tarot-mark-rotate 36s linear infinite;
            }

            .char-card::after {
                content: "";
                inset: -55%;
                background: linear-gradient(115deg, transparent 43%, rgba(255, 255, 255, 0.16) 50%, transparent 57%);
                transform: translateX(-70%) rotate(10deg);
                animation: card-shine 16s ease-in-out infinite;
            }

            .planet-orbit {
                position: absolute;
                left: 50%;
                top: 50%;
                z-index: 0;
                width: min(760px, 92vw);
                height: min(300px, 38vw);
                border: 1px solid rgba(201, 207, 238, 0.14);
                border-radius: 50%;
                pointer-events: none;
                transform: translate(-50%, -50%) rotate(-12deg);
                transform-origin: center;
            }

            .planet-orbit::before {
                content: "";
                position: absolute;
                inset: -1px;
                border: 1px solid rgba(184, 164, 119, 0.06);
                border-radius: inherit;
                transform: rotate(54deg) scaleY(0.58);
            }

            .planet-orbit .planet {
                position: absolute;
                top: 50%;
                left: -5px;
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #e9e5d2;
                box-shadow: 0 0 8px rgba(233, 229, 210, 0.9), 0 0 20px rgba(143, 176, 255, 0.42);
                transform: translateY(-50%);
            }

            .planet-orbit.orbit-one {
                animation: planet-orbit-one 34s linear infinite;
            }

            .planet-orbit.orbit-two {
                width: min(620px, 76vw);
                height: min(210px, 28vw);
                transform: translate(-50%, -50%) rotate(34deg);
                opacity: 0.72;
                animation: planet-orbit-two 27s linear infinite reverse;
            }

            .planet-orbit.orbit-two .planet {
                width: 5px;
                height: 5px;
                background: #b8a477;
                box-shadow: 0 0 7px rgba(184, 164, 119, 0.9);
            }

            .planet-orbit.orbit-three {
                width: min(900px, 108vw);
                height: min(170px, 23vw);
                transform: translate(-50%, -50%) rotate(-42deg);
                opacity: 0.48;
                animation: planet-orbit-three 46s linear infinite;
            }

            .planet-orbit.orbit-three .planet {
                width: 4px;
                height: 4px;
                background: #9db8e6;
                box-shadow: 0 0 8px rgba(157, 184, 230, 0.9);
            }

            @keyframes planet-orbit-one {
                from { transform: translate(-50%, -50%) rotate(-12deg); }
                to { transform: translate(-50%, -50%) rotate(348deg); }
            }

            @keyframes planet-orbit-two {
                from { transform: translate(-50%, -50%) rotate(34deg); }
                to { transform: translate(-50%, -50%) rotate(394deg); }
            }

            @keyframes planet-orbit-three {
                from { transform: translate(-50%, -50%) rotate(-42deg); }
                to { transform: translate(-50%, -50%) rotate(318deg); }
            }

            @keyframes list-line-breathe {
                0%, 100% { opacity: 0.35; transform: translateX(-50%) scaleX(0.5); }
                50% { opacity: 1; transform: translateX(-50%) scaleX(1); }
            }

            @keyframes tarot-mark-rotate {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }

            @keyframes card-shine {
                0%, 62%, 100% { opacity: 0; transform: translateX(-70%) rotate(10deg); }
                72% { opacity: 1; }
                84% { opacity: 0; transform: translateX(70%) rotate(10deg); }
            }

            @keyframes constellation-pulse {
                0%, 100% { opacity: 0.35; transform: translateX(-50%) scale(0.96); }
                50% { opacity: 0.85; transform: translateX(-50%) scale(1.04); }
            }

            @media (prefers-reduced-motion: reduce) {
                body::before,
                .hero::after,
                .character-list::before,
                .tarot-back::before,
                .char-card::after,
                .planet-orbit {
                    animation: none;
                }
            }

                height: 18px;
                border-radius: 50%;
                background: #e7c777;
                box-shadow: 0 0 12px rgba(255, 231, 157, 0.92), 0 0 44px rgba(193, 147, 69, 0.28);
                transform: translate(-50%, -50%);
            }

            .planet-orbit {
                z-index: 1;
                border-color: rgba(213, 220, 244, 0.2);
                animation: none;
            }

            .planet-orbit.orbit-one,
            .planet-orbit.orbit-two,
            .planet-orbit.orbit-three {
                animation: none;
            }

            .planet-orbit::before {
                border-color: rgba(184, 164, 119, 0.09);
            }

            .planet-orbit .planet-track {
                position: absolute;
                inset: 0;
                animation: planet-spin 34s linear infinite;
            }

            .planet-orbit .planet {
                top: -4px;
                left: 50%;
                width: 8px;
                height: 8px;
                background: #dbe2ff;
                box-shadow: 0 0 8px rgba(219, 226, 255, 0.95);
                transform: translateX(-50%);
            }

            .planet-orbit.orbit-two .planet-track { animation-duration: 25s; animation-direction: reverse; }
            .planet-orbit.orbit-three .planet-track { animation-duration: 43s; }
            .planet-orbit.orbit-two .planet { background: var(--gold); }
            .planet-orbit.orbit-three .planet { background: #9fbbe8; }

            footer {
                color: rgba(213, 220, 244, 0.5);
                border-top-color: rgba(184, 164, 119, 0.2);
            }

            @keyframes refined-line {
                0%, 100% { opacity: 0.35; transform: translateX(-50%) scaleX(0.48); }
                50% { opacity: 0.95; transform: translateX(-50%) scaleX(1); }
            }

            @keyframes list-stars-soft {
                0%, 100% { opacity: 0.2; }
                42% { opacity: 0.34; }
                72% { opacity: 0.24; }
            }

            @keyframes list-stars-twinkle {
                0%, 100% { opacity: 0.12; }
                35% { opacity: 0.26; }
                68% { opacity: 0.16; }
                82% { opacity: 0.3; }
            }

            @keyframes planet-spin {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }

            @media (max-width: 760px) {
                .hero {
                    min-height: 210px;
                    padding: 96px 16px 42px;
                }

                .character-list {
                    grid-template-columns: repeat(3, minmax(0, 1fr));
                    min-height: 420px;
                    gap: 10px;
                    padding: 64px 12px 64px;
                }

                .planet-orbit {
                    opacity: 0.62;
                }

                .character-list::after {
                    inset: 15% -8%;
                }

                .character-list > .tarot-back {
                    display: none;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .hero::after,
                .planet-orbit .planet-track,
                body::before,
                body::after {
                    animation: none;
                }
            }

    </style>
</head>
<body>

<header class="hero">
    <h1>CHARACTERS</h1>
    <div class="brand parallax layer-logo" onclick="location.href='index.html'">
      <img class="brandLogo" src="./logo.png" alt="KOTO" decoding="async" />
    </div>

</header>

<section class="character-list">
    <span class="solar-sun" aria-hidden="true"></span>
    <span class="planet-orbit orbit-one" aria-hidden="true"><span class="planet-track"><span class="planet"></span></span></span>
    <span class="planet-orbit orbit-two" aria-hidden="true"><span class="planet-track"><span class="planet"></span></span></span>
    <span class="planet-orbit orbit-three" aria-hidden="true"><span class="planet-track"><span class="planet"></span></span></span>
    <span class="tarot-back" aria-hidden="true" style="--tilt: -10deg;"></span>
    <a class="char-card card-left" href="meu.html">
        <img src="タロット/13.png" alt="愛生のカード">
   
       
    </a>

    <a class="char-card card-center" href="suzune.html">
        <img src="タロット/09.png" alt="鈴音のカード">
        
      
    </a>

    <a class="char-card card-right" href="sakamaki.html">
        <img src="タロット/04.png" alt="逆巻のカード">
      
    </a>
    <span class="tarot-back" aria-hidden="true" style="--tilt: 10deg;"></span>
</section>

<footer>
    <h2 class="site-map-title">SITE MAP</h2>
    <nav aria-label="サイトマップ">
        <ul class="site-map">
            <li><a href="index.html">トップページ</a></li>
            <li><a href="rule.html">利用規約</a></li>
            <li><a href="meu.html">愛生</a></li>
            <li><a href="suzune.html">鈴音</a></li>
            <li><a href="sakamaki.html">逆巻</a></li>
        </ul>
    </nav>
    <p class="footer-signature">Kikyo</p>
</footer>

<script>
    const characterList = document.querySelector('.character-list');
    const characterCards = document.querySelectorAll('.char-card');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    function randomizeCardOrientations() {
        characterCards.forEach((card) => {
            card.classList.toggle('card-inverted', Math.random() < 0.5);
        });
    }

    randomizeCardOrientations();

    function resetCardSelection() {
        characterList.classList.remove('is-selecting');
        characterCards.forEach((card) => card.classList.remove('is-selected'));
    }

    window.addEventListener('pageshow', () => {
        randomizeCardOrientations();
        resetCardSelection();
    });

    characterCards.forEach((card) => {
        card.addEventListener('click', (event) => {
            if (reduceMotion.matches || characterList.classList.contains('is-selecting')) {
                return;
            }

            event.preventDefault();
            characterList.classList.add('is-selecting');
            card.classList.add('is-selected');

            window.setTimeout(() => {
                window.location.href = card.href;
            }, 1800);
        });
    });
    
</script>

</body>
</html>
